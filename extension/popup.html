<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FTC Transcribe</title>
<style>
  /* House tokens: #0a0a0a background, gray-900 cards, green accent, Inter,
     rounded-xl, subtle gray-800 borders. Same language as the web app, so the
     extension does not read as a third-party add-on. */
  :root {
    --bg: #0a0a0a;
    --card: #111113;
    --border: #1f1f23;
    --text: #e5e5e7;
    --muted: #8a8a92;
    --accent: #16a34a;
    --accent-hover: #15803d;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 320px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .wrap { padding: 18px; }
  header { display: flex; align-items: center; gap: 9px; margin-bottom: 16px; }
  header .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--accent); flex: none; }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .meeting { font-weight: 500; margin-bottom: 3px; line-height: 1.35; }
  .muted { color: var(--muted); font-size: 12px; line-height: 1.5; }
  button {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid transparent;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .primary { background: var(--accent); color: #fff; }
  .primary:hover { background: var(--accent-hover); }
  .primary:disabled { background: #1f1f23; color: var(--muted); cursor: not-allowed; }
  .stop { background: var(--danger); color: #fff; }
  .ghost { background: transparent; border-color: var(--border); color: var(--text); }
  .ghost:hover { border-color: #2e2e34; }
  .timer {
    display: flex; align-items: center; gap: 9px;
    font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600;
    letter-spacing: -0.02em; margin-bottom: 2px;
  }
  .pulse {
    width: 9px; height: 9px; border-radius: 999px; background: var(--danger);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.25 } }
  .err { color: #fca5a5; font-size: 12px; line-height: 1.5; margin-top: 10px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .stack > * + * { margin-top: 9px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="dot"></span>
      <h1>FTC Transcribe</h1>
    </header>
    <div id="view"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
